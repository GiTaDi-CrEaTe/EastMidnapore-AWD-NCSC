[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "purba-medinipur-rice-awd-simulation"
version = "1.0.0"
description = "Integrated Soil-Water-Plant Dynamics Under Reduced Irrigation in Rice: A Field Investigation of Alternate Wetting-Drying in Purba Medinipur, West Bengal"
authors = [
    {name = "NCSC & Undergraduate Research Team", email = "research@agra-rice-awd.org"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
